apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: bastion

resources:
  - ../../base

# Fixe a tag por sha publicado pelo workflow (ex.: newTag: sha-abc1234).
images:
  - name: ghcr.io/le3dev/bastion-web
    newTag: latest
  - name: ghcr.io/le3dev/bastion-api
    newTag: latest
  - name: ghcr.io/le3dev/bastion-worker
    newTag: latest

patches:
  - target: { kind: Deployment, name: web }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target: { kind: Deployment, name: api }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target: { kind: Deployment, name: worker }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  # Hosts reais (trocar app.exemplo.com.br / api.exemplo.com.br).
  - target: { kind: Ingress, name: bastion }
    patch: |-
      - op: replace
        path: /spec/tls/0/hosts/0
        value: app.exemplo.com.br
      - op: replace
        path: /spec/tls/0/hosts/1
        value: api.exemplo.com.br
      - op: replace
        path: /spec/rules/0/host
        value: app.exemplo.com.br
      - op: replace
        path: /spec/rules/1/host
        value: api.exemplo.com.br
  # IP real do Redis gerenciado (veja README).
  - target: { kind: NetworkPolicy, name: worker-redis }
    patch: |-
      - op: replace
        path: /spec/egress/0/to/0/ipBlock/cidr
        value: 203.0.113.10/32

configMapGenerator:
  - name: bastion-config
    behavior: merge
    literals:
      - API_ORIGEM_WEB=https://app.exemplo.com.br
      - GUARDIAO_PERMITIR_REDES_PRIVADAS=false
      - SESSAO_COOKIE_SEGURO=true
