# =============================================================================
# MODELO de Secret. NAO e um Secret real e NAO esta no kustomization.yaml.
#
# - Preencha os valores via gerenciador de segredos (External Secrets, Sealed
#   Secrets, Vault, secret manager do provedor) ou com `kubectl create secret`.
# - NUNCA commite valores reais neste arquivo nem em qualquer outro do git.
# - O Secret real deve existir no namespace do overlay com o nome
#   "bastion-secrets" ANTES do `kubectl apply -k`.
#
# Exemplo imperativo (nao grava nada no git):
#   kubectl -n bastion create secret generic bastion-secrets \
#     --from-literal=DATABASE_URL=... --from-literal=REDIS_URL=... (etc.)
#
# Observacoes:
# - O worker le apenas REDIS_URL deste Secret (secretKeyRef), nunca os demais.
# - DATABASE_URL usa o papel bastion_app (sem BYPASSRLS); DATABASE_URL_MIGRACAO
#   usa o papel bastion_migrador e so e lido pelo Job de migracao e pela API.
# - CHAVE_DE_CIFRAGEM: 32 bytes (obrigatoria em producao).
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: bastion-secrets
type: Opaque
stringData:
  DATABASE_URL: "<preencher: postgres://bastion_app:...@host:5432/bastion?sslmode=require>"
  DATABASE_URL_MIGRACAO: "<preencher: postgres://bastion_migrador:...@host:5432/bastion?sslmode=require>"
  REDIS_URL: "<preencher: rediss://:...@host:6380>"
  S3_ENDPOINT: "<preencher>"
  S3_REGIAO: "<preencher>"
  S3_CHAVE_DE_ACESSO: "<preencher>"
  S3_SEGREDO: "<preencher>"
  S3_BUCKET_RELATORIOS: "<preencher>"
  CHAVE_DE_CIFRAGEM: "<preencher: 32 bytes>"
  SMTP_HOST: "<preencher>"
  SMTP_PORTA: "587"
  SMTP_SEGURO: "false"
  SMTP_USUARIO: "<preencher>"
  SMTP_SENHA: "<preencher>"
