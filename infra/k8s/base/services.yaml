apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: bastion-web
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: bastion-api
  ports:
    - name: http
      port: 3333
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: worker
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: bastion-worker
  ports:
    - name: saude
      port: 3334
      targetPort: saude
