# ALVO DE TESTE: configurado de propósito de forma INSEGURA. Nunca use como modelo.
worker_processes 1;
events { worker_connections 256; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Falha proposital: expõe a versão do nginx no cabeçalho Server.
  server_tokens on;

  server {
    listen 80;
    listen 443 ssl;
    server_name localhost alvo-de-teste;

    ssl_certificate     /etc/nginx/certs/alvo.crt;
    ssl_certificate_key /etc/nginx/certs/alvo.key;
    # Protocolos aceitáveis; a falha de TLS aqui é o certificado autoassinado e de validade curta.
    ssl_protocols TLSv1.2 TLSv1.3;

    # Falha proposital: vaza a tecnologia e a versão do back-end.
    add_header X-Powered-By "PHP/7.4.3" always;
    # Falha proposital: cookie de sessão sem HttpOnly, Secure e SameSite.
    add_header Set-Cookie "sessao=abc123; Path=/" always;
    # Falhas propositais por omissão: nenhum Content-Security-Policy, Strict-Transport-Security,
    # X-Content-Type-Options, X-Frame-Options, Referrer-Policy ou Permissions-Policy.

    root /usr/share/nginx/html;
    index index.html;

    location / {
      try_files $uri $uri/ =404;
    }
  }
}
