# Somente para DESENVOLVIMENTO. Senhas e credenciais abaixo são de dev.
# API e worker rodam no host (pnpm dev), não neste compose.
# Em produção, controle (API, banco) e execução (worker) ficam em redes separadas (ADR 2).

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_PASSWORD: postgres_dev
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18+: o volume declarado pela imagem é /var/lib/postgresql (PGDATA fica em /18/docker)
      - postgres_dados:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Armazenamento compatível com S3 (ADR 9). O contêiner roda como uid 10001;
  # o volume nomeado herda a permissão correta, sem passo extra.
  armazenamento:
    image: rustfs/rustfs:1.0.5
    environment:
      RUSTFS_ACCESS_KEY: bastion
      RUSTFS_SECRET_KEY: bastion_dev_segredo
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    command: /data
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - armazenamento_dados:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9000/health || wget -qO- http://localhost:9000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Caixa de entrada de DESENVOLVIMENTO: captura os e-mails (convites) e NÃO os entrega de verdade.
  # Interface web em 8025; SMTP em 1025.
  email:
    image: axllent/mailpit:v1.33.1
    ports:
      - "8025:8025"
      - "1025:1025"

  # Alvo propositalmente mal configurado: único alvo dos testes ponta a ponta.
  alvo-de-teste:
    build: ./infra/alvo-de-teste
    ports:
      - "8443:443"
      - "8080:80"
    volumes:
      - ./infra/alvo-de-teste/publico:/usr/share/nginx/html:ro

  # ATENÇÃO: alvo PROPOSITALMENTE VULNERÁVEL (injeção, CORS aberto, IA que vaza
  # dados...). Só para desenvolvimento e testes dos perfis ativos. NUNCA em produção.
  alvo-vulneravel:
    image: node:24-alpine
    command: node /app/servidor.js
    environment:
      PORT: "8080"
    ports:
      - "8081:8080"
    volumes:
      - ./infra/alvo-de-teste/app-vulneravel:/app:ro

volumes:
  postgres_dados:
  armazenamento_dados:
